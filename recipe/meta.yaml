{% set name = "example-robot-data" %}
{% set pythonname = "example-robot-data-loaders" %}
{% set version = "7.0.0" %}

package:
  name: {{ name|lower }}-split
  version: {{ version }}

source:
  url: https://github.com/Gepetto/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 9b9b662d6ea6816edf635de09667405748661333f0d7ae0439a017994234aac0

build:
  number: 0
  ignore_run_exports_from:
    - libpinocchio
    - eigenpy

outputs:
  - name: {{ name }}
    build:
      noarch: generic
    script: build_resources.sh  # [not win]
    script: build_resources.bat  # [win]
    requirements:
      build:
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        - cmake
        - ninja
      run:
        - __unix  # [unix]
        - __win   # [win]
    test:
      requires:
        - pkg-config
      commands:
        - pkg-config --modversion {{ name }}
        - if not exist %LIBRARY_PREFIX%\lib\cmake\example-robot-data\example-robot-dataConfig.cmake exit 1  # [win]
        - test -f $PREFIX/lib/cmake/example-robot-data/example-robot-dataConfig.cmake  # [unix]
  - name: {{ pythonname }}
    script: build_python.sh  # [not win]
    script: build_python.bat  # [win]
    build:
      noarch: python
    requirements:
      build:
        - {{ compiler('cxx') }}
        - {{ stdlib('c') }}
        - cmake
        - ninja
      host:
        - python {{ python_min }}.*
        - eigenpy
        - libpinocchio
        - {{ pin_subpackage(name, exact=true) }}
      run:
        - python >={{ python_min }}
        - numpy
        - pinocchio-python
        - coal-python
        - {{ pin_subpackage(name, exact=true) }}
    test:
      requires:
        - python {{ python_min }}
      imports:
        - example_robot_data

about:
  home: http://github.com/Gepetto/example-robot-data
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Set of robot URDFs for benchmarking and developed examples
  dev_url: https://github.com/Gepetto/example-robot-data

extra:
  recipe-maintainers:
    - jorisv
    - jcarpent
